name: Unit Tests and Docker Build

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main # Triggers on push to the main branch

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "16"]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Run Unit Tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: tests # Only run Docker job if the tests pass
    steps:
      - uses: actions/checkout@v2

      # Step 1: Log in to Docker Hub or GitHub Container Registry
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 2: Build the Docker image
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/your-app-name:${{ github.sha }} .

      # Step 3: Push the Docker image to Docker Hub
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/your-app-name:${{ github.sha }}

      # Optionally, tag the image as `latest`
      - name: Tag Docker image as latest
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/your-app-name:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/your-app-name:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/your-app-name:latest
